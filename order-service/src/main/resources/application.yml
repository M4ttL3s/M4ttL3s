server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: admin
    password: s3cur3_p4ssw0rd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: r4bb1t_s3cr3t
    listener:
      simple:
        default-requeue-rejected: false # Envia directamente al DLX ante fallo no recuperable
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

order:
  rabbitmq:
    exchange: saga.exchange
    routing-key-created: order.created
    routing-key-cancelled: order.cancelled
    stock-response-queue: order.stock-response.queue

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
